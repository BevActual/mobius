[package]
name = "mobius-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The Mobius desktop shell (Tauri)."

[features]
# The Chromium engine (CEF). Needs CMake and Ninja to build; off by default.
cef = ["dep:cef"]

[dependencies]
cef = { version = "156.3", optional = true }
mobius-host = { path = "../mobius-host" }
mobius-browser = { path = "../mobius-browser" }
base64 = "0.22"
ureq.workspace = true
url = "2"
serde_json.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
arboard = "3"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_Graphics_Gdi"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri's generated code uses `unsafe`, so this crate cannot take the workspace's `forbid(unsafe_code)`.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
