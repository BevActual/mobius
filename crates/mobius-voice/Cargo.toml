# mobius-voice: listening on this computer, as a small program of its own. It is its own workspace (the main one
# excludes it) because sherpa-onnx's Windows library is built against the static C runtime, which the app is not, and
# so that a crash in the speech code never takes Mobius down with it. `.github/workflows/voice.yml` builds and signs
# it; Mobius downloads it the first time listening on this computer is chosen, and checks it against the SHA-256
# pinned in its own build.
[package]
name = "mobius-voice"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/BevActual/mobius"
rust-version = "1.85"

[workspace]

[dependencies]
# Apache-2.0 (its LICENSE, checked 2026-11-25). Links its own prebuilt static libraries, onnxruntime among them.
sherpa-onnx = "=2.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
