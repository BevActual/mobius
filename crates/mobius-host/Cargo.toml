[package]
name = "mobius-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
mobius-store = { path = "../mobius-store" }
mobius-browser = { path = "../mobius-browser" }
mobius-workspace = { path = "../mobius-workspace" }
mobius-mcp = { path = "../mobius-mcp" }
mobius-claude = { path = "../mobius-claude" }
mobius-agent = { path = "../mobius-agent" }
base64 = "0.22"
url = "2"
ureq.workspace = true
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11.9"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }

[dev-dependencies]
tempfile = "3"
mobius-browser = { path = "../mobius-browser", features = ["fake"] }

[[bin]]
name = "fake-core"
path = "src/bin/fake_core.rs"

[lints]
workspace = true
