[package]
name = "mobius-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
mobius-store = { path = "../mobius-store" }
mobius-browser = { path = "../mobius-browser" }
mobius-workspace = { path = "../mobius-workspace" }
mobius-audio = { path = "../mobius-audio" }
mobius-mcp = { path = "../mobius-mcp" }
mobius-claude = { path = "../mobius-claude" }
mobius-agent = { path = "../mobius-agent" }
# Reaping a leftover process and finding a free port, for the local space's homeserver.
mobius-runtime = { path = "../mobius-runtime" }
# Unpacking the homeserver's download.
flate2 = "1"
base64 = "0.22"
percent-encoding = "2"
url = "2"
ureq.workspace = true
rusqlite = { workspace = true, features = ["limits", "hooks"] }
getrandom = "0.3"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
trash = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11.9"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }
sys-locale = "0.3"
# Matrix end-to-end encryption: the Olm/Megolm state machine on our own client, its store encrypted at rest.
matrix-sdk-crypto = "0.19.1"
matrix-sdk-sqlite = { version = "0.19.1", default-features = false, features = ["crypto-store"] }
ruma = { version = "0.17", features = ["client-api-c"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
grammers-client = { version = "0.12", default-features = false }
grammers-session = { version = "0.12", default-features = false, features = ["serde"] }

[features]
# The dev bridge (src/dev_bridge.rs): the host behind a web server on 127.0.0.1, for `npm run e2e:local`. Development
# only: a release build with it does not compile, and nothing that ships turns it on.
dev-bridge = []

[dev-dependencies]
tempfile = "3"
mobius-browser = { path = "../mobius-browser", features = ["fake"] }

[[bin]]
name = "fake-core"
path = "src/bin/fake_core.rs"

[[bin]]
name = "mobius-dev-bridge"
path = "src/bin/dev_bridge.rs"
required-features = ["dev-bridge"]

[lints]
workspace = true
