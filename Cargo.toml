[workspace]
resolver = "3"
members = ["crates/mobius-core", "crates/mobius-cored", "crates/mobius-agent", "crates/mobius-runtime", "crates/mobius-host", "crates/mobius-store", "crates/mobius-browser", "crates/mobius-shell", "crates/mobius-workspace", "crates/mobius-mcp", "crates/mobius-claude", "crates/mobius-audio"]
# Its own workspace: see crates/mobius-voice/Cargo.toml.
exclude = ["crates/mobius-voice"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/BevActual/mobius"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
ts-rs = "12"
ureq = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Sound is made in real time even in a dev build: the engine and its FFT are built optimised there too, or a reverb
# alone takes a quarter of a core.
[profile.dev.package.mobius-audio]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
