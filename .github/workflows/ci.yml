# The quick checks, on every push and pull request: types, the TypeScript tests and every Rust test. Linux, so it is
# fast; the end-to-end suite on Windows is in windows-e2e.yml.
name: Checks

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A pull request from a branch here is already checked by its push; one from a fork is checked here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # What the Tauri shell builds against on Linux (WebKitGTK), and the system keyring. The runner's own Azure
      # mirror once answered the index but never served a package, so apt uses Canonical's archive instead; each
      # attempt gives up after a minute without progress, is tried up to three times, and the step is capped.
      - name: Install the system libraries
        timeout-minutes: 8
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
          done
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libdbus-1-dev libssl-dev pkg-config; then
              exit 0
            fi
            echo "apt attempt $attempt failed; trying again"
            sleep $((attempt * 10))
          done
          exit 1
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: TypeScript tests
        run: npm test --workspaces --if-present
      - name: Rust tests
        run: cargo test --workspace
      - name: Generated types match the Rust ones
        run: npm run check:types
