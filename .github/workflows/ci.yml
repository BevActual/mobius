# The quick checks, on every push and pull request: types, the TypeScript tests and every Rust test. Linux, so it is
# fast; the end-to-end suite on Windows is in windows-e2e.yml.
name: Checks

# Once per pull request (on its merge with main), and once for each commit on main. A branch with no pull request
# yet is not checked: open one, even as a draft.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run still going.
# A newer push to a pull request replaces its run. On main every merge is tested on its own: each commit gets its own
# group, so two merges seconds apart never cancel each other and no commit on main goes untested.
concurrency:
  group: checks-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # A pull request from a branch here is already checked by its push; one from a fork is checked here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # What the Tauri shell builds against on Linux (WebKitGTK), and the system keyring. The packages and apt's index
      # are cached, so a run normally installs without reaching a mirror at all. Otherwise apt uses Canonical's archive
      # (the runner's Azure mirror once answered the index but never served a package); each apt call gives up after
      # 20 seconds without progress and 150 seconds in all, so a slow mirror fails fast and is tried again, three times.
      # Fresh each month, so the cached packages keep up with the archive's updates.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the system library packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.month }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install the system libraries
        timeout-minutes: 8
        run: |
          PKGS="libwebkit2gtk-4.1-dev libdbus-1-dev libssl-dev pkg-config"
          CACHE="$HOME/apt-cache"
          mkdir -p "$CACHE/archives/partial" "$CACHE/lists/partial"
          OPTS="-o Dir::Cache::Archives=$CACHE/archives -o Dir::State::Lists=$CACHE/lists -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          apt_get() { sudo timeout -k 10 150 apt-get $OPTS "$@"; }
          # Saved for the next run: the cache is read as the runner's user.
          keep() { sudo chown -R "$(id -u):$(id -g)" "$CACHE"; }
          if ls "$CACHE"/lists/*_Packages >/dev/null 2>&1 && apt_get install -y --no-download $PKGS; then
            echo "Installed from the cache"; keep; exit 0
          fi
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
          done
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y $PKGS; then keep; exit 0; fi
            echo "apt attempt $attempt failed; trying again"
            sleep $((attempt * 5))
          done
          exit 1
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: TypeScript tests
        run: npm test --workspaces --if-present
      - name: Rust tests
        run: cargo test --workspace
      - name: Generated types match the Rust ones
        run: npm run check:types
