# A release: pushing a tag v1.2.3 builds the Windows installer (the core beside the app), has it signed through
# Azure Artifact Signing when that is set up, makes the files the in-app updater reads (the installer's signature and latest.json)
# from the installer as shipped, and puts them in a draft GitHub Release for that tag. Publish the draft by hand; the
# updater only sees published releases.
#
# Code signing (Windows): Azure Artifact Signing, see docs/reference/code-signing-options.md. Needs the repository
# variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_CERTIFICATE_PROFILE, and the secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. Until AZURE_SIGNING_ACCOUNT is set, the installer is released unsigned
# (SmartScreen warns about it).
#
# Updater signature: the secrets TAURI_SIGNING_PRIVATE_KEY (the key from `npx tauri signer generate`; its public half is
# in crates/mobius-shell/tauri.conf.json, plugins.updater.pubkey) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if it
# has none). It is made after Authenticode signing, because signing changes the file and an earlier signature would
# not verify.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Signing in to Azure through OpenID Connect.
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    # Azure trusts this environment, not a tag name (federated credentials can't match v*).
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: The version, from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The installer alone: no updater key here, so package.mjs makes no updater files from the unsigned build.
      - name: Build the installer
        run: npm run package -- --version ${{ steps.version.outputs.value }}

      - name: Find the installer
        id: setup
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $setup = Get-ChildItem 'target\release\bundle\nsis' -Filter "*_${env:VERSION}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer for $env:VERSION in target\release\bundle\nsis" }
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT

      # ---- Code signing (Windows), through Azure Artifact Signing; skipped until AZURE_SIGNING_ACCOUNT is set --------
      # Signs the installer in place. Signing in through OpenID Connect: no password is stored, Azure trusts this
      # repository's `release` environment (see docs/reference/code-signing-options.md for the setup).
      - name: Sign in to Azure
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ steps.setup.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Mobius
          description-url: https://github.com/${{ github.repository }}

      - name: Check the signature
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          SETUP: ${{ steps.setup.outputs.path }}
        run: |
          $check = Get-AuthenticodeSignature $env:SETUP
          if ($check.Status -ne 'Valid') { throw "The signed installer does not verify: $($check.Status) $($check.StatusMessage)" }
          Write-Host "Signed by $($check.SignerCertificate.Subject)"
      # -------------------------------------------------------------------------------------------------------------

      # The updater's signature, from the installer as it will be shipped (signed or not).
      - name: Sign for the updater
        id: updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SETUP: ${{ steps.setup.outputs.path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Warning 'No updater signature: set the TAURI_SIGNING_PRIVATE_KEY secret for in-app updates.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # Bound to the version, as `tauri build` does when it signs.
          npx tauri signer sign --app-version $env:VERSION "$env:SETUP"
          if ($LASTEXITCODE -ne 0) { throw 'tauri signer sign failed' }
          if (-not (Test-Path "$env:SETUP.sig")) { throw "No signature was written next to $env:SETUP" }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Put it in a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SETUP: ${{ steps.setup.outputs.path }}
          NAME: ${{ steps.setup.outputs.name }}
          UPDATER_SIGNED: ${{ steps.updater.outputs.signed }}
        run: |
          $files = @($env:SETUP)
          if ($env:UPDATER_SIGNED -eq 'true') {
            $sig = "$env:SETUP.sig"
            # latest.json: what the in-app updater reads, at releases/latest/download/latest.json.
            $latest = [ordered]@{
              version = $env:VERSION
              notes = "Mobius $env:VERSION"
              pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = [ordered]@{
                'windows-x86_64' = [ordered]@{
                  signature = (Get-Content $sig -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$([uri]::EscapeDataString($env:NAME))"
                }
              }
            }
            $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 latest.json
            $files += $sig, (Resolve-Path latest.json).Path
          }
          gh release create ${{ github.ref_name }} --draft --title "Mobius $env:VERSION" --notes "Mobius $env:VERSION" $files
