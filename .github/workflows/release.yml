# A release: pushing a tag v1.2.3 builds the Windows installer (the core beside the app), has it signed through
# Azure Artifact Signing when that is set up, makes the files the in-app updater reads (the installer's signature and latest.json)
# from the installer as shipped, and puts them in a draft GitHub Release for that tag. Publish the draft by hand; the
# updater only sees published releases.
#
# Code signing (Windows): Azure Artifact Signing, see docs/reference/code-signing-options.md. Needs the repository
# variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_CERTIFICATE_PROFILE, and the secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. Until AZURE_SIGNING_ACCOUNT is set, the installer is released unsigned
# (SmartScreen warns about it).
#
# Updater signature: the secrets TAURI_SIGNING_PRIVATE_KEY (the key from `npx tauri signer generate`; its public half is
# in crates/mobius-shell/tauri.conf.json, plugins.updater.pubkey) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if it
# has none). It is made after Authenticode signing, because signing changes the file and an earlier signature would
# not verify.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Signing in to Azure through OpenID Connect.
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    # Azure trusts this environment, not a tag name (federated credentials can't match v*).
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: The version, from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The programs first (the shell, the core, mobius-inert-mcp), so they are signed before the installer packs them.
      # No updater key here, so package.mjs makes no updater files from the unsigned build.
      # The services' app ids (docs/reference/drive-sign-in.md). Empty until set: the build then says that service isn't set up.
      - name: Build the programs
        env:
          MOBIUS_DROPBOX_APP_KEY: ${{ vars.MOBIUS_DROPBOX_APP_KEY }}
          MOBIUS_MICROSOFT_CLIENT_ID: ${{ vars.MOBIUS_MICROSOFT_CLIENT_ID }}
          MOBIUS_GOOGLE_CLIENT_ID: ${{ vars.MOBIUS_GOOGLE_CLIENT_ID }}
          MOBIUS_GOOGLE_CLIENT_SECRET: ${{ secrets.MOBIUS_GOOGLE_CLIENT_SECRET }}
          MOBIUS_GOOGLE_PICKER_KEY: ${{ vars.MOBIUS_GOOGLE_PICKER_KEY }}
          MOBIUS_TELEGRAM_API_ID: ${{ vars.MOBIUS_TELEGRAM_API_ID }}
          MOBIUS_TELEGRAM_API_HASH: ${{ secrets.MOBIUS_TELEGRAM_API_HASH }}
        run: npm run package -- --version ${{ steps.version.outputs.value }} --stage build

      # ---- Code signing (Windows), through Azure Artifact Signing; skipped until AZURE_SIGNING_ACCOUNT is set --------
      # Signs the programs, then the installer: Windows, its firewall and Defender then see Mobius's publisher on every
      # program it runs, not only on the installer. The core and mobius-inert-mcp are signed here; the shell by the
      # bundler (it changes the shell as it bundles); the installer last. Signing in through OpenID Connect: no password is stored,
      # Azure trusts this repository's `release` environment (see docs/reference/code-signing-options.md for the setup).
      - name: Sign in to Azure
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the programs
        id: programs
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          # The core and mobius-inert-mcp, where the bundler takes them from (crates/mobius-shell/binaries). Not the shell:
          # the bundler writes its bundle type into it, so the bundler signs it after that (scripts/sign-windows.ps1).
          $files = @(Get-ChildItem 'crates\mobius-shell\binaries' -Filter '*.exe' | ForEach-Object FullName)
          if ($files.Count -lt 2) { throw "Expected the core and mobius-inert-mcp, found: $($files -join ', ')" }
          "files=$($files -join ',')" >> $env:GITHUB_OUTPUT

      - name: Sign the programs
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ steps.programs.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Mobius
          description-url: https://github.com/${{ github.repository }}

      - name: Check the programs' signatures
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          FILES: ${{ steps.programs.outputs.files }}
        run: |
          foreach ($file in $env:FILES -split ',') {
            $check = Get-AuthenticodeSignature $file
            if ($check.Status -ne 'Valid') { throw "$file does not verify: $($check.Status) $($check.StatusMessage)" }
            Write-Host "$(Split-Path $file -Leaf): signed by $($check.SignerCertificate.Subject)"
          }

      # What the bundler signs with (scripts/sign-windows.ps1): the same module azure/artifact-signing-action uses.
      - name: Install the signing module
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.20 -Force -Repository PSGallery

      # The installer, from the programs as signed; the bundler signs the shell once it has finished changing it.
      - name: Bundle the installer
        env:
          MOBIUS_SIGN_WINDOWS: ${{ vars.AZURE_SIGNING_ACCOUNT != '' && '1' || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          MOBIUS_DROPBOX_APP_KEY: ${{ vars.MOBIUS_DROPBOX_APP_KEY }}
          MOBIUS_MICROSOFT_CLIENT_ID: ${{ vars.MOBIUS_MICROSOFT_CLIENT_ID }}
          MOBIUS_GOOGLE_CLIENT_ID: ${{ vars.MOBIUS_GOOGLE_CLIENT_ID }}
          MOBIUS_GOOGLE_CLIENT_SECRET: ${{ secrets.MOBIUS_GOOGLE_CLIENT_SECRET }}
          MOBIUS_GOOGLE_PICKER_KEY: ${{ vars.MOBIUS_GOOGLE_PICKER_KEY }}
          MOBIUS_TELEGRAM_API_ID: ${{ vars.MOBIUS_TELEGRAM_API_ID }}
          MOBIUS_TELEGRAM_API_HASH: ${{ secrets.MOBIUS_TELEGRAM_API_HASH }}
        run: npm run package -- --version ${{ steps.version.outputs.value }} --stage bundle

      - name: Find the installer
        id: setup
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $setup = Get-ChildItem 'target\release\bundle\nsis' -Filter "*_${env:VERSION}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer for $env:VERSION in target\release\bundle\nsis" }
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT

      - name: Sign the installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ steps.setup.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Mobius
          description-url: https://github.com/${{ github.repository }}

      - name: Check the signature
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          SETUP: ${{ steps.setup.outputs.path }}
        run: |
          $check = Get-AuthenticodeSignature $env:SETUP
          if ($check.Status -ne 'Valid') { throw "The signed installer does not verify: $($check.Status) $($check.StatusMessage)" }
          Write-Host "Signed by $($check.SignerCertificate.Subject)"

      # The programs as they will be installed: unpacked from the installer, so a change made to one after it was signed
      # (as the bundler's was to the shell in v0.1.19) fails here, not on someone's computer.
      - name: Check the programs inside the installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          SETUP: ${{ steps.setup.outputs.path }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'installer-contents'
          7z x $env:SETUP "-o$out" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack $env:SETUP" }
          foreach ($name in 'mobius-shell.exe', 'mobius-cored.exe', 'mobius-inert-mcp.exe') {
            $file = Get-ChildItem $out -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "$name is not in the installer" }
            $check = Get-AuthenticodeSignature $file.FullName
            if ($check.Status -ne 'Valid') { throw "$name in the installer does not verify: $($check.Status) $($check.StatusMessage)" }
            Write-Host "$name in the installer: signed by $($check.SignerCertificate.Subject)"
          }
      # -------------------------------------------------------------------------------------------------------------

      # The updater's signature, from the installer as it will be shipped (signed or not).
      - name: Sign for the updater
        id: updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SETUP: ${{ steps.setup.outputs.path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Warning 'No updater signature: set the TAURI_SIGNING_PRIVATE_KEY secret for in-app updates.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # Bound to the version, as `tauri build` does when it signs.
          npx tauri signer sign --app-version $env:VERSION "$env:SETUP"
          if ($LASTEXITCODE -ne 0) { throw 'tauri signer sign failed' }
          if (-not (Test-Path "$env:SETUP.sig")) { throw "No signature was written next to $env:SETUP" }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Put it in a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SETUP: ${{ steps.setup.outputs.path }}
          NAME: ${{ steps.setup.outputs.name }}
          UPDATER_SIGNED: ${{ steps.updater.outputs.signed }}
        run: |
          $files = @($env:SETUP)
          if ($env:UPDATER_SIGNED -eq 'true') {
            $sig = "$env:SETUP.sig"
            # latest.json: what the in-app updater reads, at releases/latest/download/latest.json.
            $latest = [ordered]@{
              version = $env:VERSION
              notes = "Mobius $env:VERSION"
              pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = [ordered]@{
                'windows-x86_64' = [ordered]@{
                  signature = (Get-Content $sig -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$([uri]::EscapeDataString($env:NAME))"
                }
              }
            }
            $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 latest.json
            $files += $sig, (Resolve-Path latest.json).Path
          }
          gh release create ${{ github.ref_name }} --draft --title "Mobius $env:VERSION" --notes "Mobius $env:VERSION" $files
