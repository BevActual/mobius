# The end-to-end suite drives the real app on Windows (WebView2, over CDP), so it runs on a Windows machine: on pull
# requests and pushes to main, and by hand (Actions › Windows end-to-end › Run workflow) for one branch or a few files.
name: Windows end-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Only these test files (for example e2e/mobius2.spec.ts); empty runs everything'
        required: false
        default: ''

# A newer push to the same branch replaces a run still going.
concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is split by file across three machines that run at once, so a full run takes about a third as long.
  shard:
    name: e2e shard ${{ matrix.shard }}/3
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # First: the shell builds the interface's files into itself when it is compiled.
      - name: Build the interface
        run: npm run build -w @mobius/desktop
      # Every program: the core, the shell, and the stand-ins the tests use (a fake model engine, Claude, an MCP server).
      - name: Build the core, the shell and the test stand-ins
        run: cargo build --workspace --bins
      - name: Check the shell starts and opens its debugging port
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'mobius-probe'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:MOBIUS_TEST = '1'; $env:MOBIUS_USER_DATA = $data; $env:MOBIUS_HIDE_WINDOW = '1'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9555'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $data 'webview'
          $p = Start-Process -FilePath target\debug\mobius-shell.exe -PassThru -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'probe-err.log')
          $start = Get-Date; $up = $false
          while (((Get-Date) - $start).TotalSeconds -lt 120 -and -not $p.HasExited) {
            try { Invoke-RestMethod http://127.0.0.1:9555/json/version -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          $secs = [math]::Round(((Get-Date) - $start).TotalSeconds, 1)
          Write-Host "debugging port up: $up after $secs s; shell exited: $($p.HasExited) (code $($p.ExitCode))"
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object | ForEach-Object { Write-Host "web view processes: $($_.Count)" }
          Get-Content (Join-Path $env:RUNNER_TEMP 'probe-err.log') -ErrorAction SilentlyContinue | Select-Object -First 40
          $rt = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          Write-Host "WebView2 runtime: $($rt.pv)"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { Write-Host "browser process: $($_.ProcessId) $($_.CommandLine)" }
          $ids = (Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Id
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess } | ForEach-Object { Write-Host "listening: $($_.LocalAddress):$($_.LocalPort) (process $($_.OwningProcess))" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process msedgewebview2, mobius-cored -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Run the end-to-end suite (this machine's share)
        working-directory: apps/desktop
        env:
          MOBIUS_SHELL: tauri
          MOBIUS_E2E_START_MS: '60000'
          MOBIUS_TAURI_LOG: ${{ github.workspace }}\shell.log
        run: npx playwright test --shard=${{ matrix.shard }}/3 ${{ inputs.spec }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            apps/desktop/test-results
            shell.log
          retention-days: 7
      # Screenshots of every app, light and dark, from e2e/screens.spec.ts (on whichever machine ran it), for design review.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screens-${{ matrix.shard }}
          path: apps/desktop/screens
          if-no-files-found: ignore
          retention-days: 14

  # One result for the whole suite, under the name the checks have always used. A run replaced by a newer push reports
  # nothing, rather than a failure for code that was never tested.
  e2e:
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
