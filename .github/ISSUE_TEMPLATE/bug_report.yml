name: Bug report
description: Something in Mobius doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. For a security problem, please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Notes
        2. Ask Mobius to ...
        3. ...
  - type: input
    id: app
    attributes:
      label: Which app
      placeholder: Notes, Mail, Calendar, Settings, ...
  - type: input
    id: version
    attributes:
      label: Mobius version
      description: Settings > About.
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: model
    attributes:
      label: Model and how it's connected
      placeholder: ChatGPT sign-in, Claude plan, OpenRouter, local llama.cpp, ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images in here. Please remove anything private first.
